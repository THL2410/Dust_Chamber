version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dust_chamber_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: dust_chamber_db
    ports:
      - "5436:5432"
    volumes:
      - dust_chamber_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dust_chamber_rabbitmq
    restart: always
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - dust_chamber_rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: dust_chamber_redis
    restart: always
    ports:
      - "6370:6379"
    volumes:
      - dust_chamber_redis_data:/data

volumes:
  dust_chamber_pgdata:
  dust_chamber_rabbitmq_data:
  dust_chamber_redis_data:
